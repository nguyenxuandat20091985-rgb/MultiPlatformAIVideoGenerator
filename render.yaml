# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: multiplatform-ai-video-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: IMAGE_PROVIDER_ORDER
        value: gemini,openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_2
        sync: false
      - key: OPENROUTER_API_KEY_3
        sync: false
      - key: OPENROUTER_API_KEY_4
        sync: false
      - key: OPENROUTER_IMAGE_MODEL
        value: openai/gpt-image-2
      - key: OPENROUTER_IMAGE_ASPECT_RATIO
        value: "9:16"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_IMAGE_ASPECT_RATIO
        value: "9:16"
      - key: GEMINI_IMAGE_SIZE
        value: "1K"
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: OUTPUT_DIR
        value: output
      - key: PYTHONUNBUFFERED
        value: "1"
