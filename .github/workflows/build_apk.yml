name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "mobile_app/**"
      - ".github/workflows/build_apk.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "mobile_app/**"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the APK"
        required: false
        default: "http://10.0.2.2:8000"
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Prepare Android project
        working-directory: mobile_app
        run: |
          set -euo pipefail

          flutter create . --project-name multiplatform_ai_video \
            --org com.multipatform.aivideo --platforms=android

          # Overwrite settings.gradle completely (Kotlin 2.2.0 required by wakelock_plus stdlib)
          python3 -c '
          open("android/settings.gradle","w").write("""pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file(\"local.properties\").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty(\"flutter.sdk\")
        assert flutterSdkPath != null, \"flutter.sdk not set in local.properties\"
        return flutterSdkPath
    }()

    includeBuild(\"$flutterSdkPath/packages/flutter_tools/gradle\")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id \"dev.flutter.flutter-plugin-loader\" version \"1.0.0\"
    id \"com.android.application\" version \"8.6.0\" apply false
    id \"org.jetbrains.kotlin.android\" version \"2.2.0\" apply false
}

include \":app\"
""")
          '
          rm -f android/settings.gradle.kts

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 35/' "$f" || true
            sed -i -E 's/targetSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/targetSdk = 35/' "$f" || true
            sed -i -E 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' "$f" || true
            sed -i -E "s/jvmTarget[[:space:]]*=[[:space:]]*'1\.8'/jvmTarget = '17'/" "$f" || true
            sed -i -E 's/jvmTarget[[:space:]]*=[[:space:]]*"1\.8"/jvmTarget = "17"/' "$f" || true
          done

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST" || true
          fi

          echo "=== settings.gradle ==="
          cat android/settings.gradle

      - name: Resolve API base URL
        id: api_url
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="http://10.0.2.2:8000"
          fi
          echo "value=$URL" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Patch plugin Gradle (flutter.* SDK refs)
        run: |
          set -e
          find "$HOME/.pub-cache" -type f -path "*/android/build.gradle" 2>/dev/null | while read -r f; do
            if grep -qE 'flutter\.(compileSdk|targetSdk|minSdk)' "$f" 2>/dev/null; then
              echo "Patching $f"
              sed -i -E 's/flutter\.compileSdkVersion/35/g' "$f" || true
              sed -i -E 's/flutter\.targetSdkVersion/35/g' "$f" || true
              sed -i -E 's/flutter\.minSdkVersion/21/g' "$f" || true
            fi
          done

      - name: Build release APK
        working-directory: mobile_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.api_url.outputs.value }}

      - name: Rename artifact
        working-directory: mobile_app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          ls -lh dist/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile_app/dist/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`app-release-apk\`" >> "$GITHUB_STEP_SUMMARY"
