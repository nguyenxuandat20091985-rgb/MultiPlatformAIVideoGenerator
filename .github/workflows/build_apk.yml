name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "mobile_app/**"
      - ".github/workflows/build_apk.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "mobile_app/**"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the APK (e.g. http://192.168.1.10:8000 or https://api.example.com)"
        required: false
        default: "http://10.0.2.2:8000"
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure Android platform files
        working-directory: mobile_app
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create . --project-name multiplatform_ai_video --org com.multipatform.aivideo
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            if ! grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true
            fi
          fi

      - name: Resolve API base URL
        id: api_url
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="http://10.0.2.2:8000"
          fi
          echo "value=$URL" >> "$GITHUB_OUTPUT"
          echo "Using API_BASE_URL=$URL"

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.api_url.outputs.value }}

      - name: Rename artifact
        working-directory: mobile_app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          ls -lh dist/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile_app/dist/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact name:** \`app-release-apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **File:** \`app-release.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API_BASE_URL:** \`${{ steps.api_url.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### How to download" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Open this workflow run on GitHub" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Scroll to **Artifacts**" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Download **app-release-apk** and unzip to get \`app-release.apk\`" >> "$GITHUB_STEP_SUMMARY"
