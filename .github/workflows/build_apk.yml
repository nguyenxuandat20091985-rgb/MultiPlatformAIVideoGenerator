name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "mobile_app/**"
      - ".github/workflows/build_apk.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "mobile_app/**"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the APK (e.g. http://192.168.1.10:8000 or https://api.example.com)"
        required: false
        default: "http://10.0.2.2:8000"
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Ensure Android platform files
        working-directory: mobile_app
        run: |
          set -e
          if [ ! -f android/app/src/main/kotlin/com/multipatform/aivideo/multiplatform_ai_video/MainActivity.kt ] \
             && [ ! -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java ]; then
            flutter create . --project-name multiplatform_ai_video --org com.multipatform.aivideo --platforms=android
          fi

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 35/' "$f" || true
            sed -i -E 's/targetSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/targetSdk = 35/' "$f" || true
          done

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST" || true
          fi

      - name: Resolve API base URL
        id: api_url
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="http://10.0.2.2:8000"
          fi
          echo "value=$URL" >> "$GITHUB_OUTPUT"
          echo "Using API_BASE_URL=$URL"

      - name: Install dependencies
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter pub deps 2>/dev/null | grep -i package_info || true

      - name: Patch plugin Gradle (fix flutter.* on LibraryExtension)
        run: |
          set -e
          find "$HOME/.pub-cache" -type f -path "*/android/build.gradle" 2>/dev/null | while read -r f; do
            if grep -qE 'flutter\.(compileSdk|targetSdk|minSdk)' "$f" 2>/dev/null; then
              echo "Patching $f"
              sed -i -E 's/flutter\.compileSdkVersion/35/g' "$f" || true
              sed -i -E 's/flutter\.targetSdkVersion/35/g' "$f" || true
              sed -i -E 's/flutter\.minSdkVersion/21/g' "$f" || true
            fi
          done

      - name: Build release APK
        working-directory: mobile_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.api_url.outputs.value }}

      - name: Rename artifact
        working-directory: mobile_app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          ls -lh dist/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile_app/dist/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`app-release-apk\` → \`app-release.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API_BASE_URL:** \`${{ steps.api_url.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
