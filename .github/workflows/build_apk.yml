name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "mobile_app/**"
      - ".github/workflows/build_apk.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "mobile_app/**"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL baked into the APK"
        required: false
        default: "http://10.0.2.2:8000"
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Prepare Android project
        working-directory: mobile_app
        run: |
          set -euo pipefail

          flutter create . --project-name multiplatform_ai_video \
            --org com.multipatform.aivideo --platforms=android

          SETTINGS="android/settings.gradle"
          SETTINGS_KTS="android/settings.gradle.kts"
          if [ -f "$SETTINGS" ]; then
            sed -i -E 's/(id[[:space:]]+"org\.jetbrains\.kotlin\.android"[[:space:]]+version[[:space:]]+")[^"]+"/\12.0.21"/' "$SETTINGS" || true
            sed -i -E "s/(id[[:space:]]+'org\.jetbrains\.kotlin\.android'[[:space:]]+version[[:space:]]+')[^']+'/\12.0.21'/" "$SETTINGS" || true
            sed -i -E 's/(id[[:space:]]+"com\.android\.application"[[:space:]]+version[[:space:]]+")[^"]+"/\18.6.0"/' "$SETTINGS" || true
            sed -i -E "s/(id[[:space:]]+'com\.android\.application'[[:space:]]+version[[:space:]]+')[^']+'/\18.6.0'/" "$SETTINGS" || true
            echo "=== settings.gradle plugins ==="
            grep -nE 'kotlin|android.application' "$SETTINGS" || true
          fi
          if [ -f "$SETTINGS_KTS" ]; then
            sed -i -E 's/(id\("org\.jetbrains\.kotlin\.android"\)[[:space:]]+version[[:space:]]+")[^"]+"/\12.0.21"/' "$SETTINGS_KTS" || true
            sed -i -E 's/(id\("com\.android\.application"\)[[:space:]]+version[[:space:]]+")[^"]+"/\18.6.0"/' "$SETTINGS_KTS" || true
          fi

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk = 35/' "$f" || true
            sed -i -E 's/targetSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/targetSdk = 35/' "$f" || true
            sed -i -E 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' "$f" || true
            sed -i -E "s/jvmTarget[[:space:]]*=[[:space:]]*'1\.8'/jvmTarget = '17'/" "$f" || true
            sed -i -E 's/jvmTarget[[:space:]]*=[[:space:]]*"1\.8"/jvmTarget = "17"/' "$f" || true
          done

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST" || true
          fi

          mkdir -p android/app/src/main/res/drawable
          if [ ! -f android/app/src/main/res/drawable/ic_launcher.xml ]; then
            cat > android/app/src/main/res/drawable/ic_launcher.xml << 'ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#5B2EFF"/>
                  </shape>
              </item>
          </layer-list>
          ICON
          fi

          echo "=== app build.gradle SDK ==="
          grep -nE 'compileSdk|targetSdk|minSdk|jvmTarget|VERSION_' android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Resolve API base URL
        id: api_url
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="http://10.0.2.2:8000"
          fi
          echo "value=$URL" >> "$GITHUB_OUTPUT"
          echo "Using API_BASE_URL=$URL"

      - name: Install dependencies
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter pub deps 2>/dev/null | grep -i package_info || true

      - name: Patch plugin Gradle (flutter.* SDK refs)
        run: |
          set -e
          find "$HOME/.pub-cache" -type f -path "*/android/build.gradle" 2>/dev/null | while read -r f; do
            if grep -qE 'flutter\.(compileSdk|targetSdk|minSdk)' "$f" 2>/dev/null; then
              echo "Patching $f"
              sed -i -E 's/flutter\.compileSdkVersion/35/g' "$f" || true
              sed -i -E 's/flutter\.targetSdkVersion/35/g' "$f" || true
              sed -i -E 's/flutter\.minSdkVersion/21/g' "$f" || true
            fi
          done

      - name: Build release APK
        working-directory: mobile_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.api_url.outputs.value }}

      - name: Rename artifact
        working-directory: mobile_app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          ls -lh dist/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile_app/dist/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`app-release-apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API_BASE_URL:** \`${{ steps.api_url.outputs.value }}\`" >> "$GITHUB_STEP_SUMMARY"
