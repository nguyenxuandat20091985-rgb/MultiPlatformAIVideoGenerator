name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check . --ignore E501 || true

      - name: Syntax check
        run: |
          python -m py_compile main.py
          python -m py_compile api.py
          python -m py_compile config/settings.py
          find core publishers -name "*.py" -exec python -m py_compile {} +

      - name: Import check (dry)
        run: |
          python -c "from publishers import list_available_publishers; print(list_available_publishers())"
        env:
          GROQ_API_KEY: dummy
          OPENROUTER_API_KEY: dummy
