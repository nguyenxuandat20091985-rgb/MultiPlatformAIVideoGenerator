<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Factory</title>
<style>
:root{font-family:Inter,system-ui,Arial;color:#eaf0ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#9eaccb}.panel{background:#141d33;border:1px solid #293653;border-radius:18px;padding:20px;margin:18px 0}h1{font-size:28px;margin:0}label{display:block;margin:12px 0 6px;color:#bdc9e4}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #354564;background:#0c1427;color:#fff;font:inherit}button{border:0;border-radius:11px;padding:13px 18px;background:#6d7cff;color:white;font-weight:700;cursor:pointer;margin-top:16px}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{background:#1d2a45;padding:8px 12px;border-radius:20px}.bar{height:8px;background:#273653;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#7b8aff}.step{padding:9px 0;border-bottom:1px solid #283550}.step small{color:#9eaccb}@media(max-width:600px){body{padding:14px}.grid{grid-template-columns:1fr}}
</style><body><div class="top"><div><h1>🎬 Video Factory</h1><div class="muted">Nhà máy sản xuất video chạy trên máy tính của anh</div></div><span class="pill" id="health">Đang kiểm tra…</span></div>
<section class="panel"><h2>Tạo video mới</h2><form id="form"><label>Chủ đề video</label><textarea id="topic" rows="3" minlength="3" required placeholder="Ví dụ: 5 mẹo lái xe an toàn"></textarea><div class="grid"><div><label>Phong cách</label><select id="style"><option value="educational">Giáo dục</option><option value="storytelling">Kể chuyện</option><option value="motivational">Truyền cảm hứng</option><option value="entertainment">Giải trí</option></select></div><div><label>Đối tượng</label><input id="audience" value="Người xem phổ thông"></div></div><label>Lời kêu gọi</label><input id="cta" value="Theo dõi để xem video tiếp theo!"><button id="submit">🚀 Sản xuất video</button></form></section>
<section class="panel"><h2>Tiến trình sản xuất</h2><div id="status" class="muted">Chưa có tác vụ.</div><div class="bar"><i id="progress"></i></div><div id="steps"></div><div id="result"></div></section>
<script>
const $=id=>document.getElementById(id);let timer=null;
async function health(){try{let r=await fetch('/health');let d=await r.json();$('health').textContent='● Máy cục bộ sẵn sàng · '+(d.platforms||[]).length+' kênh'}catch{$('health').textContent='Không kết nối API'}}
health();
$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='Đang đưa vào hàng đợi…';$('result').innerHTML='';try{let r=await fetch('/api/v1/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:$('topic').value,style:$('style').value,target_audience:$('audience').value,cta:$('cta').value,platforms:[],tags:[]})});let d=await r.json();if(!r.ok)throw Error(d.detail||'Không tạo được tác vụ');if(timer)clearInterval(timer);await poll(d.job_id);timer=setInterval(()=>poll(d.job_id),2500)}catch(err){$('status').textContent='Lỗi: '+err.message;$('submit').disabled=false}});
async function poll(id){try{let r=await fetch('/api/v1/jobs/'+encodeURIComponent(id));let j=await r.json();$('status').textContent='Tác vụ '+id+' · '+j.status+' · '+j.progress_percent+'%';$('progress').style.width=j.progress_percent+'%';$('steps').innerHTML=(j.steps||[]).map(s=>'<div class="step">'+esc(s.name)+' — <b>'+esc(s.status)+'</b><br><small>'+esc(s.message||'Đang chờ')+'</small></div>').join('');if(j.status==='completed'){$('result').innerHTML='<a style="color:#9eafff" href="/api/v1/jobs/'+encodeURIComponent(id)+'/video">⬇ Xem / tải video hoàn thành</a>';clearInterval(timer);$('submit').disabled=false}else if(j.status==='failed'){$('result').textContent=j.error||'Tác vụ thất bại';clearInterval(timer);$('submit').disabled=false}}catch(e){$('status').textContent='Mất kết nối tạm thời; sẽ thử lại…'}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
