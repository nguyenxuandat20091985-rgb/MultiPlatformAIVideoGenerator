name: multiplatform_ai_video
description: Mobile client for MultiPlatform AI Video Generator — create & publish Shorts/Reels/TikTok.
publish_to: "none"
version: 1.1.0+4

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  video_player: ^2.8.2
  chewie: ^1.7.5
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  intl: ^0.19.0
  url_launcher: ^6.2.5
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  package_info_plus: 8.0.2

flutter:
  uses-material-design: true
